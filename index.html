<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Transaction Tracker</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <h1>Transaction Tracker</h1>

  <section id="balance-section">
    <h2>Balance: $<span id="balance">0</span></h2>
  </section>

  <section id="form-section">
    <form id="transaction-form">
      <div>
        <label for="item-name">Item Name</label>
        <input type="text" id="item-name" name="item-name" placeholder="e.g. Coffee" />
      </div>
      <div>
        <label for="amount">Amount</label>
        <input type="number" id="amount" name="amount" placeholder="e.g. 4.50" step="0.01" min="0" />
      </div>
      <div>
        <label for="category">Category</label>
        <select id="category" name="category">
          <option value="Food">Food</option>
          <option value="Transport">Transport</option>
          <option value="Fun">Fun</option>
        </select>
      </div>
      <p id="error-msg" aria-live="polite"></p>
      <button type="submit">Add Transaction</button>
    </form>
  </section>

  <section id="list-section">
    <h2>Transactions</h2>
    <ul id="transaction-list"></ul>
  </section>

  <section id="chart-section">
    <h2>Spending by Category</h2>
    <div id="chart-container">
      <canvas id="spending-chart"></canvas>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
